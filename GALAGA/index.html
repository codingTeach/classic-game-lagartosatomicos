<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>Galaga 3D - A-Frame MVP</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Retro score box overlay */
        #score-box {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 300px;
            padding: 12px 14px;
            color: #00ffea;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            background: linear-gradient(180deg, rgba(6,6,12,0.85) 0%, rgba(10,8,20,0.75) 100%);
            border: 2px solid rgba(0,255,234,0.12);
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,255,234,0.06), 0 0 18px rgba(0,255,234,0.06) inset;
            backdrop-filter: blur(2px);
            z-index: 9999;
            -webkit-user-select: none;
            user-select: none;
        }
        #score-box:before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 8px;
            pointer-events: none;
            background-image: repeating-linear-gradient(transparent 0 4px, rgba(255,255,255,0.02) 4px 5px);
        }
        #score-box .score-row { display: flex; justify-content: space-between; align-items: center; }
        #score-box .score-label { color: #77ffef; opacity: 0.9; font-size: 9px; }
        #score-box .score-value { color: #fffb7d; font-size: 18px; line-height: 1; margin-left: 8px; text-shadow: 0 0 8px rgba(255,255,125,0.35); }
        #score-box .hp { color: #ff6b6b; }
        #score-box .wave { color: #9af; }
        /* Neon pulse when score increases */
        @keyframes neonPulse {
            0% { box-shadow: 0 0 6px rgba(255,255,125,0.15), 0 0 18px rgba(0,255,234,0.05) inset; transform: scale(1); }
            40% { box-shadow: 0 0 18px rgba(255,255,125,0.45), 0 0 34px rgba(0,255,234,0.12) inset; transform: scale(1.02); }
            100% { box-shadow: 0 6px 18px rgba(0,0,0,0.35); transform: scale(1); }
        }
        .pulse {
            animation: neonPulse 520ms ease-out;
        }
        /* subtle scanline flicker */
        @keyframes scanFlicker { 0% {opacity:0.96} 50% {opacity:0.88} 100% {opacity:0.96} }
        #score-box:after { content: ""; position:absolute; inset:0; border-radius:10px; mix-blend-mode:overlay; animation: scanFlicker 2.2s infinite; pointer-events:none; }
        /* Center banner for start / wave / game over messages */
        #center-banner {
            position: fixed;
            left: 50%;
            top: 34%;
            transform: translateX(-50%);
            min-width: 480px;
            max-width: 90%;
            padding: 22px 28px;
            background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(8,6,16,0.65));
            border: 3px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            text-align: center;
            z-index: 10000;
            pointer-events: none;
            display: none;
        }
        #center-banner.show { display: block; pointer-events: auto; }
        #center-banner .title { font-family: 'Press Start 2P', monospace; font-size: 28px; color: #ffd86b; text-shadow: 0 0 12px rgba(255,200,80,0.25); }
        /* Score larger on game over */
        #center-banner .subtitle { margin-top: 10px; font-family: 'Press Start 2P', monospace; font-size: 18px; color: #9ff; opacity: 0.98; }
        /* Make the restart hint a bit bigger */
        #center-banner .restart { margin-top: 14px; font-size: 14px; color: #ffdf7d; opacity: 0.98; }
        /* entrance animation */
        @keyframes bannerIn { 0% { transform: translate(-50%, -8%) scale(0.98); opacity: 0 } 60% { transform: translate(-50%,0%) scale(1.01); opacity: 1 } 100% { transform: translate(-50%,0) scale(1); } }
        #center-banner.show { animation: bannerIn 480ms cubic-bezier(.2,.9,.2,1); }
    </style>
</head>

<body>
    <a-scene>
        <!-- LUZ -->
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>

        <!-- Assets: modelos GLB locales y textura de cielo -->
        <a-assets timeout="10000">
            <img id="skyImage" src="eso0932a.jpg" />
            <img id="stelaImage" src="stela.jpg" />
            <a-asset-item id="sceneModel" src="playermodel.glb"></a-asset-item>
            <a-asset-item id="alien1Model" src="alien1.glb"></a-asset-item>
            <a-asset-item id="alien2Model" src="alien2.glb"></a-asset-item>
            <a-asset-item id="alien3Model" src="alien3.glb"></a-asset-item>
        </a-assets>

        <!-- SKY: imagen 360 equirectangular -->
        <a-sky src="#skyImage" rotation="0 90 0"></a-sky>

        <!-- “TUNEL” / REFERENCIAS VISUALES -->
        <a-entity id="lane">
            <a-plane rotation="-90 0 0" width="40" height="400" position="0 0 -160" material="shader: flat; src: #stelaImage; side: double"></a-plane>
            <a-entity id="stars"></a-entity>
        </a-entity>

        <!-- HUD se mueve dentro de la cámara para que siga al jugador -->

        <!-- PLAYER RIG: nave + cámara atrás -->
        <a-entity id="playerRig" position="0 1 0" player-controller>
            <!-- nave (modelo GLB local — muestra solo "Avionsito") -->
            <a-entity id="playerShip" gltf-model="#sceneModel" gltf-part="name: Avionsito" scale="0.5 0.5 0.5" rotation="0 180 0" position="0 0 0"></a-entity>

            <!-- cámara tercera persona desde atrás --> 
            <a-entity id="cam" camera look-controls="enabled: false" position="0 1.2 3.2"
                rotation="-10 0 0">
                <!-- HUD fijado a la cámara: siempre visible -->
                <a-text id="hud" value="HP: 3   Score: 0   Wave: 1" position="-0.85 0.45 -1.2" width="2.4" color="#0ff" font="monoid" visible="false"></a-text>
                <a-text id="combo-hud" value="" position="0 0.35 -1.2" width="1.8" color="#ff0" align="center" visible="false"></a-text>
                <a-text id="wave-message" value="" position="0 0.05 -1.2" width="3" color="#0f0" align="center" visible="false"></a-text>
            </a-entity>
        </a-entity>

        <!-- Contenedores -->
        <a-entity id="bullets"></a-entity>
        <a-entity id="enemies"></a-entity>
        <a-entity id="powerups"></a-entity>
        <a-entity id="particles"></a-entity>

        <!-- Sistema de juego mejorado -->
        <a-entity game-manager></a-entity>
        <a-entity enemy-spawner="playerSelector: #playerRig; containerSelector: #enemies; waveEvery: 8; enemiesPerWave: 6"></a-entity>
    </a-scene>

    <script>

        /* ===== Componente gltf-part =====
         * Usa gltf-model para cargar un GLB que contiene varios objetos,
         * y oculta todos excepto el nodo con el nombre indicado.
         */
        AFRAME.registerComponent('gltf-part', {
            schema: {
                name: { type: 'string', default: '' }
            },
            init() {
                this.el.addEventListener('model-loaded', () => this.filterModel());
            },
            filterModel() {
                const targetName = this.data.name;
                if (!targetName) return;
                const model = this.el.getObject3D('mesh');
                if (!model) return;
                model.traverse((node) => {
                    // Solo ocultar nodos del primer nivel (hijos directos de la Scene)
                    if (node.parent === model) {
                        node.visible = (node.name === targetName);
                    }
                });
            }
        });

        AFRAME.registerComponent("enemy-bullet", {
            schema: {
                speed: { default: 18 },   // unidades/seg
                ttl: { default: 3.0 },    // segundos
                radius: { default: 0.2 }, // para colisión simple
            },
            init() {
                this.life = this.data.ttl;
                // Cache player ref (si existe)
                this.playerEl = this.el.sceneEl.querySelector("#playerRig") || this.el.sceneEl.querySelector("#playerShip");
            },
            tick(time, dt) {
                const d = dt / 1000;
                this.life -= d;

                // Avanza hacia el jugador (en +Z si el jugador va hacia -Z)
                this.el.object3D.position.z += this.data.speed * d;

                // Colisión simple vs jugador (si existe)
                if (this.playerEl) {
                    const p = this.playerEl.object3D.position;
                    const b = this.el.object3D.position;
                    const dx = p.x - b.x, dy = p.y - b.y, dz = p.z - b.z;
                    const dist2 = dx * dx + dy * dy + dz * dz;
                    const hitR = (this.data.radius + 0.6); // 0.6 ~ radio aprox jugador
                    if (dist2 < hitR * hitR) {
                        this.el.sceneEl.emit("enemyHitPlayer", { damage: 1, bullet: this.el });
                        safeRemove(this.el);
                        return;
                    }
                }

                if (this.life <= 0) safeRemove(this.el);
            }
        });


        /** =========================
         *  ENEMY (IA simple)
         *  Estados:
         *   - "entry": entra con curva
         *   - "patrol": se mueve en seno
         *   - "attack": se lanza hacia el jugador y luego vuelve
         *  ========================= */
        AFRAME.registerComponent("enemy-ai", {
            schema: {
                hp: { default: 1 },

                // Movimiento
                approachSpeed: { default: 8 }, // hacia +Z
                patrolAmp: { default: 2.0 },
                patrolFreq: { default: 2.2 },

                // Ataque
                attackChancePerSec: { default: 0.25 }, // probabilidad de iniciar ataque (por segundo)
                attackSpeed: { default: 16 },
                retreatSpeed: { default: 12 },

                // Disparo
                fireRate: { default: 1.2 },     // seg
                fireJitter: { default: 0.6 },   // random extra
                bulletSpeed: { default: 18 },

                // Referencias / límites
                playerSelector: { default: "#playerRig" },
                boundsX: { default: 7 },
                minZFromPlayer: { default: -90 }, // spawns típicos
                despawnBehind: { default: 10 },   // si pasa al jugador por mucho
            },

            init() {
                this.state = "entry";
                this.t = Math.random() * 999;
                this.fireT = 0.4 + Math.random() * 0.8;
                this.currentHP = this.data.hp; // Track HP separately
                this.playerEl = this.el.sceneEl.querySelector(this.data.playerSelector)
                    || this.el.sceneEl.querySelector("#playerShip");

                // Para animar entrada: punto “home” al que quiere llegar
                const p = this.el.object3D.position;
                this.home = { x: p.x, y: p.y, z: p.z };

                // inicio entry desde un poco más lejos y arriba
                p.y += 2 + Math.random() * 1.5;
                p.z -= 12 + Math.random() * 10;

                // Colisión con balas de jugador (si tu juego emite "playerBulletHit")
                // Alternativa: tu manager puede llamar el método takeDamage directamente.
                this.el.addEventListener("takeDamage", (e) => {
                    const dmg = (e.detail && e.detail.damage) ? e.detail.damage : 1;
                    this.takeDamage(dmg);
                });
            },

            takeDamage(dmg) {
                this.currentHP -= dmg;
                if (this.currentHP <= 0) {
                    const pos = this.el.object3D.position;
                    this.el.sceneEl.emit("enemyDied", { 
                        enemy: this.el, 
                        score: 10,
                        x: pos.x,
                        y: pos.y,
                        z: pos.z
                    });
                    safeRemove(this.el);
                }
            },

            spawnBullet() {
                const o = this.el.object3D.position;

                const b = document.createElement("a-sphere");
                b.setAttribute("radius", 0.07);
                b.setAttribute("material", "color: #bb6bd9; emissive: #bb6bd9; emissiveIntensity: 0.55");
                b.setAttribute("position", `${o.x} ${o.y} ${o.z + 0.8}`);
                b.setAttribute("enemy-bullet", `speed: ${this.data.bulletSpeed}; ttl: 3; radius: 0.2`);

                // Si tienes un contenedor #bullets, lo usamos; si no, al scene.
                const container = this.el.sceneEl.querySelector("#bullets") || this.el.sceneEl;
                container.appendChild(b);
            },

            tick(time, dt) {
                const d = dt / 1000;
                const obj = this.el.object3D;
                const p = this.playerEl ? this.playerEl.object3D.position : null;

                // Disparo (solo si está relativamente cerca del “carril”)
                this.fireT -= d;
                if (this.fireT <= 0) {
                    this.fireT = this.data.fireRate + Math.random() * this.data.fireJitter;
                    // Dispara si existe player y el enemigo no está demasiado lejos
                    if (p && (obj.position.z - p.z) < 70) this.spawnBullet();
                }

                // Despawn si ya “rebasó” al jugador
                if (p && obj.position.z > p.z + this.data.despawnBehind) {
                    safeRemove(this.el);
                    return;
                }

                // FSM
                this.t += d;

                if (this.state === "entry") {
                    // Se acerca al plano de juego con suavizado a home (x,y,z)
                    obj.position.z += this.data.approachSpeed * d;

                    // Lerp hacia home en X/Y
                    obj.position.x += (this.home.x - obj.position.x) * (d * 2.2);
                    obj.position.y += (this.home.y - obj.position.y) * (d * 2.2);

                    // Cuando llega “cerca” de la homeZ, pasa a patrol
                    if (obj.position.z >= this.home.z - 0.5) {
                        this.state = "patrol";
                        this.entryBaseX = obj.position.x;
                        this.entryBaseY = obj.position.y;
                    }
                    return;
                }

                if (this.state === "patrol") {
                    // Patrulla en X con seno, y avanza lentamente para presión
                    const wave = Math.sin(this.t * this.data.patrolFreq) * this.data.patrolAmp;
                    obj.position.x = this.entryBaseX + wave;
                    obj.position.x = Math.max(-this.data.boundsX, Math.min(this.data.boundsX, obj.position.x));

                    obj.position.z += (this.data.approachSpeed * 0.55) * d;

                    // Probabilidad de ataque por segundo
                    if (p && Math.random() < this.data.attackChancePerSec * d) {
                        this.state = "attack";
                        this.attackTargetX = p.x;
                        this.attackTargetY = p.y;
                        this.attackStartZ = obj.position.z;
                        this.attackPhase = "dive";
                    }
                    return;
                }

                if (this.state === "attack") {
                    if (!p) {
                        this.state = "patrol";
                        return;
                    }

                    // Fase dive: persigue X/Y y se lanza en +Z rápido
                    if (this.attackPhase === "dive") {
                        obj.position.x += (this.attackTargetX - obj.position.x) * (d * 3.0);
                        obj.position.y += (this.attackTargetY - obj.position.y) * (d * 3.0);
                        obj.position.z += this.data.attackSpeed * d;

                        // Si ya llegó al jugador (o lo pasó), cambia a retreat
                        if (obj.position.z >= p.z + 1.5) {
                            this.attackPhase = "retreat";
                            // vuelve a un “home” nuevo (re-entra)
                            this.home = {
                                x: (Math.random() * 12) - 6,
                                y: 1.2 + Math.random() * 2.2,
                                z: p.z - (60 + Math.random() * 25)
                            };
                        }
                        return;
                    }

                    // Fase retreat: se va “adelante” otra vez para re-formar
                    if (this.attackPhase === "retreat") {
                        // En retreat realmente queremos ir hacia -Z (adelante del jugador),
                        // porque el jugador va hacia -Z. Así que restamos Z.
                        obj.position.z -= this.data.retreatSpeed * d;

                        obj.position.x += (this.home.x - obj.position.x) * (d * 1.8);
                        obj.position.y += (this.home.y - obj.position.y) * (d * 1.8);

                        // cuando ya está suficientemente adelante, vuelve a entry->patrol
                        if (obj.position.z <= this.home.z) {
                            this.state = "entry";
                        }
                    }
                }
            }
        });


        /** =========================
         *  ENEMY SPAWNER (oleadas)
         *  - spawnea formaciones Galaga-like
         *  - depende del player Z para colocar “adelante”
         *  ========================= */
        AFRAME.registerComponent("enemy-spawner", {
            schema: {
                playerSelector: { default: "#playerRig" },
                containerSelector: { default: "#enemies" },

                waveEvery: { default: 1.1 },  // seg
                enemiesPerWave: { default: 5 },

                // Distancia delante del jugador para spawn
                aheadMin: { default: 70 },
                aheadMax: { default: 95 }
            },

            init() {
                this.t = this.data.waveEvery; // Iniciar con el timer lleno
                this.playerEl = this.el.sceneEl.querySelector(this.data.playerSelector)
                    || this.el.sceneEl.querySelector("#playerShip");
                this.container = this.el.sceneEl.querySelector(this.data.containerSelector) || this.el.sceneEl;

                this.waveIndex = 0;
                this.paused = false;
                this.spawnedInitial = false;
            },

            tick(time, dt) {
                if (this.paused) return; // No generar enemigos si está pausado
                
                // Generar la primera oleada inmediatamente
                if (!this.spawnedInitial) {
                    this.spawnedInitial = true;
                    this.spawnWave();
                    // Iniciar el juego sin pausar: permitir que el spawner siga activo
                    this.paused = false;
                    return;
                }
                
                const d = dt / 1000;
                this.t -= d;
                if (this.t > 0) return;

                this.t = this.data.waveEvery;
                this.spawnWave();
            },

            spawnEnemyAt(x, y, z, opts = {}) {
                const e = document.createElement("a-entity");

                // Seleccionar aleatoriamente uno de los 3 modelos de aliens
                const alienModels = ['#alien1Model', '#alien2Model', '#alien3Model'];
                const randomAlien = alienModels[Math.floor(Math.random() * alienModels.length)];
                
                e.setAttribute('gltf-model', randomAlien);
                e.setAttribute('scale', opts.scale || '0.5 0.5 0.5');
                e.setAttribute('rotation', opts.rotation || '0 180 0');
                e.setAttribute("position", `${x} ${y} ${z}`);

                // Tunear por tipo
                const cfg = [
                    `hp:${opts.hp ?? 1}`,
                    `approachSpeed:${opts.approachSpeed ?? (7 + Math.random() * 4)}`,
                    `patrolAmp:${opts.patrolAmp ?? (1.0 + Math.random() * 2.2)}`,
                    `patrolFreq:${opts.patrolFreq ?? (1.8 + Math.random() * 1.8)}`,
                    `attackChancePerSec:${opts.attackChancePerSec ?? (0.18 + Math.random() * 0.22)}`,
                    `fireRate:${opts.fireRate ?? (1.0 + Math.random() * 1.0)}`,
                    `fireJitter:${opts.fireJitter ?? 0.6}`,
                    `bulletSpeed:${opts.bulletSpeed ?? 18}`,
                    `playerSelector:${opts.playerSelector ?? "#playerRig"}`
                ].join(";");

                e.setAttribute("enemy-ai", cfg);
                this.container.appendChild(e);
            },

            spawnWave() {
                if (!this.playerEl) return;

                const pz = this.playerEl.object3D.position.z;
                const ahead = this.data.aheadMin + Math.random() * (this.data.aheadMax - this.data.aheadMin);
                const baseZ = pz - ahead; // adelante del jugador (más negativo)

                // Alterna tipos de formación
                const mode = this.waveIndex % 3;
                this.waveIndex++;
                
                // Notificar al game manager que se está generando una oleada
                const gameManager = this.el.sceneEl.querySelector('[game-manager]');
                if (gameManager && gameManager.components['game-manager']) {
                    gameManager.components['game-manager'].enemiesInWave += this.data.enemiesPerWave;
                }

                if (mode === 0) {
                    // V formation con más espacio
                    const n = this.data.enemiesPerWave;
                    const centerX = 0;
                    for (let i = 0; i < n; i++) {
                        const side = (i % 2 === 0) ? 1 : -1;
                        const step = Math.floor(i / 2) + 1;
                        const x = centerX + side * step * 2.2; // Aumentado de 1.4 a 2.2
                        const y = 1.4 + step * 0.35;
                        const z = baseZ - step * 2.0; // Aumentado de 1.2 a 2.0
                        this.spawnEnemyAt(x, y, z);
                    }
                    return;
                }

                if (mode === 1) {
                    // Grid / bloque con más espacio
                    const rows = 2;
                    const cols = Math.ceil(this.data.enemiesPerWave / rows);
                    let count = 0;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (count >= this.data.enemiesPerWave) break;
                            const x = (c - (cols - 1) / 2) * 2.5; // Aumentado de 1.8 a 2.5
                            const y = 1.4 + r * 1.5; // Aumentado de 1.1 a 1.5
                            const z = baseZ - r * 2.2; // Aumentado de 1.6 a 2.2
                            this.spawnEnemyAt(x, y, z, { attackChancePerSec: 0.12 + Math.random() * 0.18 });
                            count++;
                        }
                    }
                    return;
                }

                // mode === 2: arco/círculo parcial
                const n = this.data.enemiesPerWave;
                const radius = 5.5;
                const start = -Math.PI * 0.85;
                const end = -Math.PI * 0.15;
                for (let i = 0; i < n; i++) {
                    const t = i / Math.max(1, n - 1);
                    const ang = start + (end - start) * t;
                    const x = Math.cos(ang) * radius;
                    const y = 1.6 + Math.sin(ang) * 1.2;
                    const z = baseZ - (Math.abs(i - (n - 1) / 2) * 0.8);
                    this.spawnEnemyAt(x, y, z, { patrolAmp: 1.2 + Math.random() * 1.0 });
                }
            }
        });
        // ---------- Power-ups ----------
        AFRAME.registerComponent('powerup', {
            schema: {
                type: { default: 'shield' }, // shield, rapidfire, spread
                speed: { default: 6 },
                ttl: { default: 8 }
            },
            init() {
                this.life = this.data.ttl;
                this.rotSpeed = 2 + Math.random() * 2;
            },
            tick(time, dt) {
                const d = dt / 1000;
                this.life -= d;
                const obj = this.el.object3D;
                
                // Avanza hacia el jugador
                obj.position.z += this.data.speed * d;
                obj.rotation.y += this.rotSpeed * d;
                
                // Colisión con jugador
                const player = this.el.sceneEl.querySelector('#playerRig');
                if (player) {
                    const p = player.object3D.position;
                    const dx = p.x - obj.position.x;
                    const dy = p.y - obj.position.y;
                    const dz = p.z - obj.position.z;
                    if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 1.2) {
                        this.el.sceneEl.emit('powerupCollected', { type: this.data.type });
                        safeRemove(this.el);
                        return;
                    }
                }
                
                if (this.life <= 0) safeRemove(this.el);
            }
        });

        // ---------- Particle System ----------
        AFRAME.registerComponent('particle', {
            schema: {
                vx: { default: 0 },
                vy: { default: 0 },
                vz: { default: 0 },
                life: { default: 0.6 }
            },
            init() {
                this.age = 0;
            },
            tick(time, dt) {
                const d = dt / 1000;
                this.age += d;
                
                const obj = this.el.object3D;
                obj.position.x += this.data.vx * d;
                obj.position.y += this.data.vy * d;
                obj.position.z += this.data.vz * d;
                
                // Fade out
                const opacity = 1 - (this.age / this.data.life);
                this.el.setAttribute('material', 'opacity', Math.max(0, opacity));
                
                if (this.age >= this.data.life) safeRemove(this.el);
            }
        });

        // ---------- Helpers ----------
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function dist(a, b) {
            const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
            return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        function safeRemove(el) {
            if (el && el.parentNode) el.parentNode.removeChild(el);
        }
        
        function spawnExplosion(scene, x, y, z, color = '#ff6600') {
            const container = scene.querySelector('#particles') || scene;
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('a-sphere');
                p.setAttribute('radius', 0.08 + Math.random() * 0.08);
                p.setAttribute('material', `color: ${color}; emissive: ${color}; emissiveIntensity: 0.8; opacity: 1`);
                p.setAttribute('position', `${x} ${y} ${z}`);
                
                const angle = (Math.PI * 2 * i) / 12;
                const speed = 3 + Math.random() * 4;
                p.setAttribute('particle', `vx: ${Math.cos(angle) * speed}; vy: ${Math.sin(angle) * speed * 0.5}; vz: ${(Math.random() - 0.5) * 2}; life: ${0.4 + Math.random() * 0.4}`);
                container.appendChild(p);
            }
        }

        // ---------- Player Controller ----------
        AFRAME.registerComponent('player-controller', {
            schema: {
                speed: { default: 7.0 },        // auto-avance (unidades/seg)
                strafe: { default: 7.5 },       // movimiento lateral
                boundsX: { default: 6.5 },      // límites carril
                boundsY: { default: 3.0 },      // límites vertical (si quieres)
                fireRate: { default: 0.18 }     // cooldown entre disparos
            },
            init() {
                this.keys = {};
                this.fireT = 0;
                this.canFire = true;
                this.shield = false;
                this.rapidFire = false;
                this.spreadShot = false;
                this.powerupTimer = 0;
                
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    // Disparar con barra espaciadora
                    if (e.code === 'Space' && this.canFire) {
                        this.fire();
                    }
                });
                window.addEventListener('keyup', (e) => this.keys[e.code] = false);
            },
            
            fire() {
                if (this.fireT > 0) return; // Cooldown activo
                
                this.fireT = this.rapidFire ? 0.08 : this.data.fireRate;
                
                if (this.spreadShot) {
                    this.el.sceneEl.emit('spawnBullet', { spread: true });
                } else {
                    this.el.sceneEl.emit('spawnBullet', { spread: false });
                }
            },
            
            activatePowerup(type, duration = 8) {
                this.powerupTimer = duration;
                if (type === 'shield') {
                    this.shield = true;
                    this.el.querySelector('#playerShip').setAttribute('material', 'color', '#00ffff');
                } else if (type === 'rapidfire') {
                    this.rapidFire = true;
                } else if (type === 'spread') {
                    this.spreadShot = true;
                }
            },
            tick(time, dt) {
                const d = dt / 1000;
                const pos = this.el.object3D.position;
                
                // Cooldown de disparo
                if (this.fireT > 0) {
                    this.fireT -= d;
                }
                
                // Powerup timer
                if (this.powerupTimer > 0) {
                    this.powerupTimer -= d;
                    if (this.powerupTimer <= 0) {
                        this.shield = false;
                        this.rapidFire = false;
                        this.spreadShot = false;
                        this.el.querySelector('#playerShip').setAttribute('material', 'color', '#56ccf2');
                    }
                }
                // auto-avanza hacia adelante (en -Z para “ir hacia el fondo”)
                pos.z -= this.data.speed * d;

                // movimiento lateral / vertical con teclas
                let mx = 0, my = 0;
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) mx -= 1;
                if (this.keys['ArrowRight'] || this.keys['KeyD']) mx += 1;
                if (this.keys['ArrowUp'] || this.keys['KeyW']) my += 1;
                if (this.keys['ArrowDown'] || this.keys['KeyS']) my -= 1;

                pos.x = clamp(pos.x + mx * this.data.strafe * d, -this.data.boundsX, this.data.boundsX);
                pos.y = clamp(pos.y + my * this.data.strafe * d, 0.6, this.data.boundsY);
            }
        });

        // ---------- Bullet ----------
        AFRAME.registerComponent('bullet', {
            schema: { speed: { default: 30 }, ttl: { default: 1.8 } },
            init() {
                this.life = this.data.ttl;
            },
            tick(time, dt) {
                const d = dt / 1000;
                this.life -= d;
                this.el.object3D.position.z -= this.data.speed * d; // sale hacia -Z
                if (this.life <= 0) safeRemove(this.el);
            }
        });

        // ---------- Enemy ----------
        AFRAME.registerComponent('boss', {
            schema: {
                hp: { default: 50 },
                speed: { default: 4 }
            },
            init() {
                this.currentHP = this.data.hp;
                this.maxHP = this.data.hp;
                this.t = 0;
                this.fireT = 0;
                this.phase = 0;
            },
            takeDamage(dmg) {
                this.currentHP -= dmg;
                // Flash red
                this.el.setAttribute('material', 'color', '#ff0000');
                setTimeout(() => {
                    this.el.setAttribute('material', 'color', '#ff00ff');
                }, 100);
                
                if (this.currentHP <= 0) {
                    const pos = this.el.object3D.position;
                    this.el.sceneEl.emit('bossDied', { x: pos.x, y: pos.y, z: pos.z });
                    spawnExplosion(this.el.sceneEl, pos.x, pos.y, pos.z, '#ff00ff');
                    safeRemove(this.el);
                }
            },
            tick(time, dt) {
                const d = dt / 1000;
                this.t += d;
                this.fireT -= d;
                
                const obj = this.el.object3D;
                const player = this.el.sceneEl.querySelector('#playerRig');
                if (!player) return;
                
                const p = player.object3D.position;
                
                // Movement pattern
                obj.position.x = Math.sin(this.t * 1.2) * 5;
                obj.position.y = 2.5 + Math.cos(this.t * 0.8) * 1.5;
                obj.position.z = p.z - 40 + Math.sin(this.t * 0.5) * 5;
                
                // Fire pattern
                if (this.fireT <= 0) {
                    this.fireT = 0.3;
                    for (let i = -2; i <= 2; i++) {
                        const b = document.createElement('a-sphere');
                        b.setAttribute('radius', 0.1);
                        b.setAttribute('material', 'color: #ff00ff; emissive: #ff00ff; emissiveIntensity: 0.8');
                        b.setAttribute('position', `${obj.position.x + i * 0.5} ${obj.position.y} ${obj.position.z}`);
                        b.setAttribute('enemy-bullet', 'speed: 20; ttl: 4; radius: 0.25');
                        const container = this.el.sceneEl.querySelector('#bullets');
                        if (container) container.appendChild(b);
                    }
                }
            }
        });

        // ---------- Game Manager ----------
        AFRAME.registerComponent('game-manager', {
            init() {
                this.score = 0;
                this.hp = 3;
                this.wave = 1;
                this.combo = 0;
                this.comboTimer = 0;
                this.kills = 0;
                this.gameOver = false;
                this.enemiesInWave = 0;
                this.enemiesKilledInWave = 0;
                this.waveCompleteCheckTimer = 0;

                this.playerRigEl = document.querySelector('#playerRig');
                this.player = this.playerRigEl.object3D;
                this.playerController = null; // se resuelve lazy en getPlayerController()
                this.enemiesEl = document.querySelector('#enemies');
                this.bulletsEl = document.querySelector('#bullets');
                this.powerupsEl = document.querySelector('#powerups');
                this.hudEl = document.querySelector('#hud');
                this.comboHudEl = document.querySelector('#combo-hud');
                this.waveMessageEl = document.querySelector('#wave-message');
                // Center banner overlay element (HTML)
                this.centerBannerEl = document.querySelector('#center-banner');

                // HTML overlay score box (retro)
                this.lastScore = 0;
                this.scoreBoxEl = document.querySelector('#score-box');
                this.scoreHpEl = document.querySelector('#score-hp');
                this.scoreValueEl = document.querySelector('#score-value');
                this.scoreWaveEl = document.querySelector('#score-wave');

                this.powerupSpawnTimer = 15; // First powerup after 15 segs
                this.bossActive = false;

                // estrellas mejoradas (decoración)
                const stars = document.querySelector('#stars');
                for (let i = 0; i < 200; i++) {
                    const s = document.createElement('a-sphere');
                    s.setAttribute('radius', 0.02 + Math.random() * 0.04);
                    s.setAttribute('material', 'color: #ffffff; opacity: ' + (0.5 + Math.random() * 0.5));
                    const x = (Math.random() * 80) - 40;
                    const y = (Math.random() * 30) + 1;
                    const z = (Math.random() * -500);
                    s.setAttribute('position', `${x} ${y} ${z}`);
                    stars.appendChild(s);
                }

                // eventos
                this.el.sceneEl.addEventListener('spawnBullet', (e) => this.spawnBullet(e.detail));
                this.el.sceneEl.addEventListener('enemyDied', (e) => this.onEnemyDied(e.detail));
                this.el.sceneEl.addEventListener('enemyHitPlayer', (e) => this.onPlayerHit(e.detail));
                this.el.sceneEl.addEventListener('powerupCollected', (e) => this.onPowerupCollected(e.detail));
                this.el.sceneEl.addEventListener('bossDied', (e) => this.onBossDied(e.detail));
                
                // Mostrar mensaje inicial
                this.showWaveMessage('WAVE 1 - START!');
                
                // Agregar listener para reiniciar
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'KeyR' && this.gameOver) {
                        this.restartGame();
                    }
                });
            },
            
            onEnemyDied(detail) {
                this.kills++;
                this.enemiesKilledInWave++;
                this.combo++;
                this.comboTimer = 2.0;
                const comboBonus = Math.floor(this.combo / 5);
                this.score += detail.score + (comboBonus * 5);
                
                if (detail.x !== undefined) {
                    spawnExplosion(this.el.sceneEl, detail.x, detail.y, detail.z, '#ff6600');
                }
                
                // Actualizar combo HUD
                if (this.combo > 1) {
                    this.comboHudEl.setAttribute('value', `COMBO x${this.combo}!`);
                }
                
                this.updateHUD();
                
                // Verificar si se completó la oleada
                if (this.enemiesKilledInWave >= this.enemiesInWave && this.enemiesInWave > 0) {
                    this.waveCompleteCheckTimer = 3.0; // Esperar 3 segundos antes de avanzar
                }
            },
            
            getPlayerController() {
                if (!this.playerController) {
                    this.playerController = this.playerRigEl.components['player-controller'];
                }
                return this.playerController;
            },

            onPlayerHit(detail) {
                const pc = this.getPlayerController();
                if (pc && pc.shield) {
                    // Shield absorbe el daño
                    pc.shield = false;
                    pc.powerupTimer = 0;
                    return;
                }
                
                this.hp -= detail.damage || 1;
                this.updateHUD();
                
                if (this.hp <= 0) {
                    this.endGame();
                }
            },
            
            onPowerupCollected(detail) {
                const pc = this.getPlayerController();
                if (pc) pc.activatePowerup(detail.type, 10);
                this.score += 50;
                this.updateHUD();
            },
            
            onBossDied(detail) {
                this.score += 500;
                this.bossActive = false;
                // Extra explosions for boss death
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        spawnExplosion(this.el.sceneEl, 
                            detail.x + (Math.random() - 0.5) * 3, 
                            detail.y + (Math.random() - 0.5) * 2, 
                            detail.z + (Math.random() - 0.5) * 2, 
                            '#ff00ff');
                    }, i * 300);
                }
                this.updateHUD();
                setTimeout(() => this.nextWave(), 2000);
            },
            
            showWaveMessage(msg) {
                // Prefer HTML center banner if present
                if (this.centerBannerEl) {
                    this.centerBannerEl.innerHTML = `<div class="title">${msg}</div>`;
                    this.centerBannerEl.classList.add('show');
                    setTimeout(() => { this.centerBannerEl.classList.remove('show'); }, 2800);
                    return;
                }
                this.waveMessageEl.setAttribute('value', msg);
                setTimeout(() => { this.waveMessageEl.setAttribute('value', ''); }, 3000);
            },
            
            nextWave() {
                this.wave++;
                this.enemiesKilledInWave = 0;
                this.enemiesInWave = 0;
                this.showWaveMessage(`WAVE ${this.wave}`);
                this.updateHUD();
                
                // Reactivar el spawner
                const spawner = document.querySelector('[enemy-spawner]');
                if (spawner && spawner.components['enemy-spawner']) {
                    spawner.components['enemy-spawner'].paused = false;
                }
                
                // Cada 3 ondas, spawn un boss
                if (this.wave % 3 === 0) {
                    setTimeout(() => this.spawnBoss(), 4000);
                }
            },
            
            spawnBoss() {
                if (this.bossActive) return;
                this.bossActive = true;
                this.showWaveMessage('⚠ BOSS INCOMING! ⚠');
                
                const pz = this.player.position.z - 60;
                const b = document.createElement('a-entity');
                
                // Boss usa un alien aleatorio pero más grande
                const alienModels = ['#alien1Model', '#alien2Model', '#alien3Model'];
                const randomAlien = alienModels[Math.floor(Math.random() * alienModels.length)];
                
                b.setAttribute('gltf-model', randomAlien);
                b.setAttribute('scale', '1.4 1.4 1.4');
                b.setAttribute('rotation', '0 180 0');
                b.setAttribute('position', `0 2.5 ${pz}`);
                b.setAttribute('boss', `hp: ${30 + this.wave * 10}`);
                this.enemiesEl.appendChild(b);
            },
            
            spawnPowerup() {
                const pz = this.player.position.z - (50 + Math.random() * 30);
                const px = (Math.random() * 10) - 5;
                const py = 1.5 + Math.random() * 1.5;
                
                const types = ['shield', 'rapidfire', 'spread'];
                const colors = { shield: '#00ffff', rapidfire: '#ffff00', spread: '#ff00ff' };
                const type = types[Math.floor(Math.random() * types.length)];
                
                const p = document.createElement('a-entity');
                p.setAttribute('geometry', 'primitive: torus; radius: 0.4; radiusTubular: 0.1');
                p.setAttribute('material', `color: ${colors[type]}; emissive: ${colors[type]}; emissiveIntensity: 0.8; metalness: 0.5`);
                p.setAttribute('position', `${px} ${py} ${pz}`);
                p.setAttribute('powerup', `type: ${type}`);
                this.powerupsEl.appendChild(p);
            },
            
            restartGame() {
                window.location.reload();
            },
            
            endGame() {
                this.gameOver = true;
                
                // Generar explosión de la nave
                const playerPos = this.player.position;
                spawnExplosion(this.el.sceneEl, playerPos.x, playerPos.y, playerPos.z, '#ff0000');
                
                // Explosiones adicionales para efecto dramático
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        spawnExplosion(this.el.sceneEl, 
                            playerPos.x + (Math.random() - 0.5) * 2, 
                            playerPos.y + (Math.random() - 0.5) * 1.5, 
                            playerPos.z + (Math.random() - 0.5) * 2, 
                            '#ff8800');
                    }, i * 150);
                }
                
                // Ocultar la nave después de la explosión
                setTimeout(() => {
                    const playerShip = document.querySelector('#playerShip');
                    if (playerShip) playerShip.setAttribute('visible', 'false');
                }, 500);
                
                // Show center banner with nicer design for game over / restart
                if (this.centerBannerEl) {
                    this.centerBannerEl.innerHTML = `<div class="title">GAME OVER</div><div class="title">Score: ${this.score}</div><div class="title">Press R to Restart</div>`;
                    this.centerBannerEl.classList.add('show');
                } else {
                    this.hudEl.setAttribute('value', `GAME OVER | Score: ${this.score} | Press R to Restart`);
                }
                // stop player input and firing
                const pr = document.querySelector('#playerRig');
                if (pr) pr.setAttribute('player-controller', 'speed: 0; fireRate: 999');
                // Try to pause spawner component safely
                const spawner = document.querySelector('[enemy-spawner]');
                if (spawner && spawner.components && spawner.components['enemy-spawner']) {
                    spawner.components['enemy-spawner'].paused = true;
                }
            },

            tick(time, dt) {
                if (this.gameOver) return;
                const d = dt / 1000;

                // Combo timer
                if (this.comboTimer > 0) {
                    this.comboTimer -= d;
                    if (this.comboTimer <= 0) {
                        this.combo = 0;
                        this.comboHudEl.setAttribute('value', '');
                    }
                }

                // Powerup spawn timer
                this.powerupSpawnTimer -= d;
                if (this.powerupSpawnTimer <= 0) {
                    this.powerupSpawnTimer = 12 + Math.random() * 8;
                    this.spawnPowerup();
                }
                
                // Wave complete check timer
                if (this.waveCompleteCheckTimer > 0) {
                    this.waveCompleteCheckTimer -= d;
                    if (this.waveCompleteCheckTimer <= 0) {
                        // Verificar si realmente no hay enemigos
                        const remainingEnemies = Array.from(this.enemiesEl.children).length;
                        if (remainingEnemies === 0 && !this.bossActive) {
                            // Pausar el spawner
                            const spawner = document.querySelector('[enemy-spawner]');
                            if (spawner && spawner.components['enemy-spawner']) {
                                spawner.components['enemy-spawner'].paused = true;
                            }
                            this.nextWave();
                        }
                    }
                }

                // Colisiones: balas jugador vs enemigos (incluido boss)
                const enemies = Array.from(this.enemiesEl.children);
                const bullets = Array.from(this.bulletsEl.querySelectorAll('[bullet]'));
                for (const b of bullets) {
                    const bp = b.object3D.position;
                    for (const e of enemies) {
                        if (!e.object3D) continue;
                        const ep = e.object3D.position;
                        const hitDist = e.components['boss'] ? 2.0 : 0.8;
                        if (dist(bp, ep) < hitDist) {
                            safeRemove(b);
                            if (e.components['boss']) {
                                e.components['boss'].takeDamage(1);
                            } else if (e.components['enemy-ai']) {
                                e.components['enemy-ai'].takeDamage(1);
                            } else {
                                safeRemove(e);
                                this.score += 10;
                                this.updateHUD();
                            }
                            break;
                        }
                    }
                }
                
                // Colisiones: enemigos vs jugador (perder vida al chocar)
                const playerPos = this.player.position;
                const pc = this.getPlayerController();
                for (const e of enemies) {
                    if (!e.object3D) continue;
                    const ep = e.object3D.position;
                    const collisionDist = e.components['boss'] ? 2.5 : 1.2;
                    if (dist(playerPos, ep) < collisionDist) {
                        // Si tiene shield, absorbe el impacto
                        if (pc && pc.shield) {
                            pc.shield = false;
                            pc.powerupTimer = 0;
                            safeRemove(e);
                            continue;
                        }
                        
                        // Perder vida
                        this.hp -= 1;
                        this.updateHUD();
                        safeRemove(e);
                        
                        // Verificar game over
                        if (this.hp <= 0) {
                            this.endGame();
                        }
                        break;
                    }
                }
                // Balas enemigas se manejan via enemy-bullet + evento enemyHitPlayer -> onPlayerHit
            },

            updateHUD() {
                this.hudEl.setAttribute('value', `HP: ${this.hp}   Score: ${this.score}   Wave: ${this.wave}`);

                // Update HTML overlay if present
                try {
                    if (this.scoreBoxEl) {
                        // simple pulse animation when score increases
                        const delta = this.score - (this.lastScore || 0);
                        if (this.scoreHpEl) this.scoreHpEl.textContent = String(this.hp);
                        if (this.scoreValueEl) this.scoreValueEl.textContent = String(this.score);
                        if (this.scoreWaveEl) this.scoreWaveEl.textContent = String(this.wave);

                        if (delta > 0) {
                            this.scoreBoxEl.classList.remove('pulse');
                            // trigger reflow to restart animation
                            void this.scoreBoxEl.offsetWidth;
                            this.scoreBoxEl.classList.add('pulse');
                            setTimeout(() => { this.scoreBoxEl.classList.remove('pulse'); }, 700);
                        }
                        this.lastScore = this.score;
                    }
                } catch(e) { /* ignore DOM errors in non-browser env */ }
            },

            spawnBullet(detail) {
                const p = this.player.position;
                
                if (detail && detail.spread) {
                    // Disparo múltiple
                    for (let i = -1; i <= 1; i++) {
                        const b = document.createElement('a-sphere');
                        b.setAttribute('radius', 0.07);
                        b.setAttribute('material', 'color: #ff00ff; emissive: #ff00ff; emissiveIntensity: 0.7');
                        b.setAttribute('position', `${p.x + i * 0.3} ${p.y} ${p.z - 1.2}`);
                        b.setAttribute('bullet', 'speed: 35; ttl: 1.6');
                        this.bulletsEl.appendChild(b);
                    }
                } else {
                    // Disparo normal
                    const b = document.createElement('a-sphere');
                    b.setAttribute('radius', 0.08);
                    b.setAttribute('material', 'color: #f2c94c; emissive: #f2c94c; emissiveIntensity: 0.6');
                    b.setAttribute('position', `${p.x} ${p.y} ${p.z - 1.2}`);
                    b.setAttribute('bullet', 'speed: 35; ttl: 1.6');
                    this.bulletsEl.appendChild(b);
                }
            }
        });
    </script>
    <!-- Retro HTML overlay score box -->
    <div id="score-box" aria-live="polite">
        <div class="score-row">
            <div class="score-label">HP</div>
            <div class="score-value hp" id="score-hp">3</div>
        </div>
        <div style="height:8px"></div>
        <div class="score-row">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score-value">0</div>
        </div>
        <div style="height:8px"></div>
        <div class="score-row">
            <div class="score-label">WAVE</div>
            <div class="score-value wave" id="score-wave">1</div>
        </div>
    </div>
    <!-- Center banner for start / wave / gameover messages -->
    <div id="center-banner" role="status" aria-atomic="true"></div>
</body>

</html>
